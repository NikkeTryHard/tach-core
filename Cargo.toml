[package]
name = "tach-core"
version = "0.1.0"
edition = "2021"
description = "Hypervisor-accelerated Python test runner"
license = "MIT"
repository = "https://github.com/NikkeTryHard/tach-core"

[lib]
name = "tach_core"
path = "src/lib.rs"

[[bin]]
name = "tach-core"
path = "src/main.rs"

# Experimental binaries (TLS research)
[[bin]]
name = "tls_exploration"
path = "experiments/tls_restoration_poc.rs"

[[bin]]
name = "tls_python_poc"
path = "experiments/tls_python_poc.rs"

[[bin]]
name = "tls_sentinel_scan"
path = "experiments/tls_sentinel_scan.rs"

[dependencies]
# Core
pyo3 = { version = "0.27", features = ["auto-initialize"] }
anyhow = "1.0"
thiserror = "2.0"
dashmap = "6.1"
libc = "0.2"

# System interfaces (ptrace for TLS capture, namespaces for isolation)
nix = { version = "0.30", features = ["process", "signal", "uio", "socket", "fs", "mount", "sched", "term", "ptrace"] }

# Discovery (static AST analysis)
rustpython-parser = "0.4"
rustpython-ast = "0.4"
ignore = "0.4"
walkdir = "2.4"
rayon = "1.10"

# Toxicity graph
petgraph = "0.8"

# Scheduler
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
num_cpus = "1.16"

# Memory snapshots (userfaultfd)
userfaultfd = "0.9"
uuid = { version = "1.0", features = ["v4"] }

# Configuration
toml = "0.9"

# Lifecycle
signal-hook = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1.0"

# Reporting
quick-xml = { version = "0.38", features = ["serialize"] }
indicatif = "0.18"
atty = "0.2"

# Watch mode
notify = "8.2"
crossbeam-channel = "0.5"

# Deterministic allocator (required for snapshot integrity)
tikv-jemallocator = "0.6"
tikv-jemalloc-sys = { version = "0.6", features = ["stats"] }

# ELF parsing (libpython segment identification)
goblin = "0.10"

# Coverage (zero-copy ring buffer)
memmap2 = "0.9"

# Sandbox (Landlock + Seccomp)
landlock = "0.4"
seccompiler = "0.5"

[dev-dependencies]
tempfile = "3"
bincode = { version = "2.0", features = ["serde"] }
wait-timeout = "0.2"
proptest = "1.4"

# Integration tests
[[test]]
name = "discovery_integration"
path = "rust_tests/discovery_integration.rs"

[[test]]
name = "protocol_integration"
path = "rust_tests/protocol_integration.rs"

[[test]]
name = "resolver_integration"
path = "rust_tests/resolver_integration.rs"

[[test]]
name = "implementation_tests"
path = "rust_tests/implementation_tests.rs"

[[test]]
name = "physics_check"
path = "rust_tests/physics_check.rs"

[[test]]
name = "snapshot_integration"
path = "rust_tests/snapshot_integration.rs"

[[test]]
name = "loader_integration"
path = "rust_tests/loader_integration.rs"

[[test]]
name = "toxicity_integration"
path = "rust_tests/toxicity_integration.rs"

[[test]]
name = "tagging_integrity"
path = "rust_tests/tagging_integrity.rs"

[[test]]
name = "scheduler_integration"
path = "rust_tests/phase4_integration.rs"

[[test]]
name = "sandbox_enforcement"
path = "rust_tests/sandbox_enforcement.rs"

[[test]]
name = "memory_invariant"
path = "rust_tests/memory_invariant.rs"

[[test]]
name = "proptest_coverage"
path = "rust_tests/proptest_coverage.rs"

[[test]]
name = "proptest_snapshot"
path = "rust_tests/proptest_snapshot.rs"

[[test]]
name = "proptest_scheduler"
path = "rust_tests/proptest_scheduler.rs"

[[test]]
name = "proptest_discovery"
path = "rust_tests/proptest_discovery.rs"

[[test]]
name = "proptest_namespace"
path = "rust_tests/proptest_namespace.rs"

[[test]]
name = "diagnostics_integration"
path = "rust_tests/diagnostics_integration.rs"

[[test]]
name = "errors_integration"
path = "rust_tests/errors_integration.rs"

[[test]]
name = "coverage_e2e"
path = "rust_tests/coverage_e2e.rs"

[[test]]
name = "concurrent_stress"
path = "rust_tests/concurrent_stress.rs"

[[test]]
name = "restoration_invariant"
path = "rust_tests/restoration_invariant.rs"

[[test]]
name = "plugin_bridge_integration"
path = "rust_tests/plugin_bridge_integration.rs"
