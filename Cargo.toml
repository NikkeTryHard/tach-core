[package]
name = "tach-core"
version = "0.2.0"
edition = "2024"
description = "Hypervisor-accelerated Python test runner"
license = "MIT"
repository = "https://github.com/NikkeTryHard/tach-core"
rust-version = "1.88"

[lib]
name = "tach_core"
path = "src/lib.rs"

[[bin]]
name = "tach-core"
path = "src/main.rs"

# Experimental binaries (TLS research)
[[bin]]
name = "tls_exploration"
path = "experiments/tls_restoration_poc.rs"
required-features = ["experiments"]

[[bin]]
name = "tls_python_poc"
path = "experiments/tls_python_poc.rs"
required-features = ["experiments"]

[[bin]]
name = "tls_sentinel_scan"
path = "experiments/tls_sentinel_scan.rs"
required-features = ["experiments"]

[features]
experiments = []

[dependencies]
# Core
pyo3 = { version = "0.27.2", features = ["auto-initialize"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
dashmap = "6.1"
libc = "0.2"

# System interfaces (ptrace for TLS capture, namespaces for isolation)
nix = { version = "0.30.1", features = ["process", "signal", "uio", "socket", "fs", "mount", "sched", "term", "ptrace"] }

# Discovery (static AST analysis)
rustpython-parser = "0.4"
rustpython-ast = "0.4"
ignore = "0.4"
walkdir = "2.4"
rayon = "1.10"

# Toxicity graph
petgraph = "0.8"

# Scheduler
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
num_cpus = "1.16"

# Memory snapshots (userfaultfd)
userfaultfd = "0.9"
uuid = { version = "1.0", features = ["v4"] }

# Configuration
toml = "0.9"

# Lifecycle
signal-hook = "0.4"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4"
serde_json = "1.0"

# Reporting
quick-xml = { version = "0.38", features = ["serialize"] }
indicatif = "0.18"
terminal_size = "0.4"

# Watch mode
notify = "8.2"
crossbeam-channel = "0.5"

# Deterministic allocator (required for snapshot integrity)
tikv-jemallocator = "0.6"
tikv-jemalloc-sys = { version = "0.6", features = ["stats"] }

# ELF parsing (libpython segment identification)
goblin = "0.10"

# Coverage (zero-copy ring buffer)
memmap2 = "0.9"

# Sandbox (Landlock + Seccomp)
landlock = "0.4.4"
seccompiler = "0.5"

[dev-dependencies]
tempfile = "3"
bincode = { version = "2.0", features = ["serde"] }
wait-timeout = "0.2"
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "hot_paths"
harness = false

# Integration tests
