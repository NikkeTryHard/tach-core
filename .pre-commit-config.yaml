# Pre-commit configuration for tach-core
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Docs: https://pre-commit.com

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(target/|coverage/)
      - id: end-of-file-fixer
        exclude: ^(target/|coverage/)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Rust hooks (local - uses system cargo)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code with rustfmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code with clippy (warnings as errors)
        entry: bash -c 'cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test (lib)
        description: Run library unit tests
        entry: cargo test --lib
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: build-docs
        name: build full documentation
        description: Regenerate FULL_DOCUMENTATION.md from source docs
        entry: ./scripts/build-docs.sh
        language: script
        files: ^docs/.*\.md$
        pass_filenames: false

  # Python hooks (for gauntlet tests)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        files: ^tests/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^tests/

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [cargo-fmt, cargo-clippy, cargo-test, build-docs] # Skip Rust hooks in CI (handled by dedicated jobs)
  submodules: false
