name: Fuzz Testing

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly on Sunday at 3am
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Run fuzz targets
        run: |
          cd fuzz
          for target in fuzz_targets/*.rs; do
            name=$(basename "$target" .rs)
            echo "Fuzzing $name for 60 seconds..."
            cargo +nightly fuzz run "$name" -- -max_total_time=60 || true
          done
        timeout-minutes: 45

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore
