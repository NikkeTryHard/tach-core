name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # Manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Faster compilation
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        # Clippy warnings are now treated as errors (no continue-on-error)

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install pytest

      - name: Build
        run: cargo build

      - name: Run library tests
        run: cargo test --lib
        timeout-minutes: 10

      - name: Run integration tests
        run: cargo test --test '*'
        timeout-minutes: 10

  coverage:
    name: Code Coverage (llvm-cov)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    env:
      COVERAGE_THRESHOLD: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install pytest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace \
            --lcov --output-path coverage/lcov.info \
            --html --output-dir coverage/html
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cargo llvm-cov --all-features --workspace --summary-only 2>/dev/null | grep -oP 'lines:\s+\K[\d.]+(?=%)' || echo "0")
          echo "Coverage: ${COVERAGE}%"
          echo "Threshold: ${COVERAGE_THRESHOLD}%"
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "::warning::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
          else
            echo "Coverage meets threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          name: tach-core-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        continue-on-error: true # Advisory only for now

  gauntlet:
    name: Python Gauntlet Tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install pytest

      - name: Build Rust library
        run: cargo build --release

      - name: Run gauntlet tests
        run: |
          pytest tests/gauntlet_coverage/ -v --tb=short
          pytest tests/gauntlet_restoration/ -v --tb=short
          pytest tests/gauntlet_plugin/ -v --tb=short
          pytest tests/gauntlet_concurrent/ -v --tb=short
        timeout-minutes: 15

  proptest:
    name: Property Tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Run property tests
        run: |
          cargo test --test proptest_coverage -- --test-threads=1
          cargo test --test proptest_snapshot -- --test-threads=1
          cargo test --test proptest_scheduler -- --test-threads=1
          cargo test --test proptest_discovery -- --test-threads=1
          cargo test --test proptest_namespace -- --test-threads=1
        timeout-minutes: 15
        env:
          PROPTEST_CASES: 256
