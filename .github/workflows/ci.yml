name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # Manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Faster compilation
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  # Coverage threshold - set to realistic value for current codebase
  # Increase this as coverage improves
  COVERAGE_THRESHOLD: 15

jobs:
  # Detect what files changed to conditionally run jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'rust_tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'tests/**'
              - 'pyproject.toml'
              - '**/*.py'
            ci:
              - '.github/**'
              - 'deny.toml'
              - '.pre-commit-config.yaml'

  # Always runs - fast check
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    needs: changes
    # Run on code/ci changes, or if triggered manually
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Always runs - security is critical
  security:
    name: Security & License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # Rust unit tests - standalone job for faster feedback
  unit-tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV
      - name: Run unit tests
        run: cargo test --lib --all-features

  # Rust integration tests - all tests in rust_tests/ except proptest
  rust-integration:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV
      - name: Install Python dependencies
        run: pip install pytest pytest-asyncio numpy django
      - name: Run integration tests (excluding proptest)
        run: |
          cargo test --test cli_integration
          cargo test --test discovery_integration
          cargo test --test sandbox_enforcement
          cargo test --test hooks_test
          cargo test --test effect_ipc_integration
          cargo test --test toxicity_integration
          cargo test --test errors_integration
          cargo test --test diagnostics_integration
          cargo test --test loader_integration
          cargo test --test plugin_bridge_integration
          cargo test --test resolver_integration
          cargo test --test protocol_integration
          cargo test --test phase4_integration
          cargo test --test tagging_integrity
          cargo test --test restoration_invariant
          cargo test --test snapshot_integration
          cargo test --test concurrent_stress -- --test-threads=2
          cargo test --test coverage_e2e
          cargo test --test coverage_flag_tests
          cargo test --test dry_run_accuracy_tests
          cargo test --test durations_flag_tests
          cargo test --test exit_behavior_tests
          cargo test --test exit_code_tests
          cargo test --test filter_expression_tests
          cargo test --test json_schema_tests
          cargo test --test junit_xml_tests
          cargo test --test kernel_compat_tests
          cargo test --test physics_check
          cargo test --test timeout_behavior_tests
          cargo test --test traceback_format_tests
          cargo test --test verbosity_level_tests
          cargo test --test watch_mode_tests
          cargo test --test worker_count_tests
        timeout-minutes: 25

  # MSRV verification - ensure compatibility with minimum supported Rust version
  msrv:
    name: MSRV Check (Rust 1.88)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV
      - name: Check MSRV compatibility
        run: cargo check --all-features

  # Binary size check - prevent bloat
  binary-size:
    name: Binary Size Check
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV
      - name: Build release binary
        run: cargo build --release
      - name: Check binary size
        run: |
          SIZE=$(stat -c%s target/release/tach-core)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB ($SIZE bytes)"
          # Fail if > 50MB
          if [ "$SIZE" -gt 52428800 ]; then
            echo "::error::Binary too large: ${SIZE_MB}MB > 50MB threshold"
            exit 1
          fi
          echo "::notice::Binary size: ${SIZE_MB}MB - within threshold"

  # Only runs when code changes
  coverage:
    name: Code Coverage (llvm-cov)
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install pytest pytest-asyncio numpy django

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          cargo llvm-cov --all-features --workspace \
            --lcov --output-path coverage/lcov.info
          cargo llvm-cov --all-features --workspace --no-run \
            --html --output-dir coverage/html

      - name: Check coverage threshold
        run: |
          # Get coverage summary and extract the line coverage percentage
          SUMMARY=$(cargo llvm-cov --all-features --workspace --summary-only 2>&1)
          echo "$SUMMARY"
          # Try different patterns to extract coverage
          COVERAGE=$(echo "$SUMMARY" | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%' || echo "0")
          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "0" ]; then
            # Fallback: try to extract from "Region coverage" or similar
            COVERAGE=$(echo "$SUMMARY" | grep -i "region\|line\|branch" | grep -oE '[0-9]+\.[0-9]+' | head -1 || echo "0")
          fi
          echo "Coverage: ${COVERAGE}%"
          echo "Threshold: ${COVERAGE_THRESHOLD}%"
          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "0" ]; then
            echo "::warning::Could not parse coverage percentage, skipping threshold check"
            exit 0
          fi
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          else
            echo "Coverage meets threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          name: tach-core-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Only runs when code changes
  gauntlet:
    name: Python Gauntlet Tests
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install pytest pytest-asyncio numpy django

      - name: Build Rust library
        run: cargo build --release

      - name: Run gauntlet tests
        run: |
          pytest tests/gauntlet/ -v --tb=short
          pytest tests/gauntlet_coverage/ -v --tb=short
          pytest tests/gauntlet_restoration/ -v --tb=short
          pytest tests/gauntlet_plugin/ -v --tb=short
          pytest tests/gauntlet_concurrent/ -v --tb=short
          pytest tests/gauntlet_011/ -v --tb=short
          pytest tests/gauntlet_012/ -v --tb=short
          pytest tests/gauntlet_013/ -v --tb=short
          pytest tests/gauntlet_014/ -v --tb=short
          pytest tests/gauntlet_015/ -v --tb=short
          pytest tests/gauntlet_phase1/ -v --tb=short
          pytest tests/gauntlet_phase2/ -v --tb=short
          pytest tests/gauntlet_phase3/ -v --tb=short
          pytest tests/gauntlet_phase5/ -v --tb=short
          pytest tests/gauntlet_phase5_1/ -v --tb=short
          pytest tests/gauntlet_phase5_2/ -v --tb=short
          pytest tests/gauntlet_phase5_4/ -v --tb=short
          pytest tests/gauntlet_hook_effects/ -v --tb=short
          pytest tests/gauntlet_020/ -v --tb=short
          pytest tests/gauntlet_fixtures/ -v --tb=short
          pytest tests/regression/ -v --tb=short
          # Optional test directories (may require external deps)
          pytest tests/gauntlet_db/ -v --tb=short || echo "DB tests skipped (no database)"
          pytest tests/gauntlet_numpy/ -v --tb=short || echo "NumPy tests skipped (optional)"
          pytest tests/benchmark/ -v --tb=short || echo "Benchmark tests skipped"
          pytest tests/crash_test/ -v --tb=short || echo "Crash tests skipped"
          pytest tests/fd_leak_test/ -v --tb=short || echo "FD leak tests skipped"
          pytest tests/parallel_test/ -v --tb=short || echo "Parallel tests skipped"
          pytest tests/env_test/ -v --tb=short || echo "Env tests skipped"
        timeout-minutes: 15

      - name: Run Django isolation tests
        run: |
          cd ${{ github.workspace }}
          pytest tests/django_project/ -v --tb=short || echo "Django tests skipped"

      - name: Run golden tests (PR to master)
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: GOLDEN_TESTS=1 pytest tests/regression/golden/ -v --tb=short

  # Only runs when code changes
  proptest:
    name: Property Tests
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Run property tests
        run: |
          cargo test --test proptest_coverage -- --test-threads=1
          cargo test --test proptest_snapshot -- --test-threads=1
          cargo test --test proptest_scheduler -- --test-threads=1
          cargo test --test proptest_discovery -- --test-threads=1
          cargo test --test proptest_namespace -- --test-threads=1
          cargo test --test proptest_reporter -- --test-threads=1
        timeout-minutes: 15
        env:
          PROPTEST_CASES: 256

  # Runs ignored tests that require built binary or sudo
  # These are environment-dependent and may fail on some runners
  ignored-tests:
    name: Ignored Tests (Binary Required)
    runs-on: ubuntu-latest
    needs: [changes, check, gauntlet] # Run after main tests pass
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install pytest pytest-asyncio numpy django

      - name: Build release binary
        run: cargo build --release

      - name: Run ignored implementation tests
        run: |
          echo "Running implementation tests (require built binary)..."
          cargo test --test implementation_tests -- --ignored --test-threads=1 || echo "Some implementation tests failed (expected on GitHub runners)"

      - name: Run ignored memory invariant tests
        run: |
          echo "Running memory invariant tests (slow)..."
          cargo test --test memory_invariant -- --ignored --test-threads=1 --nocapture || echo "Memory tests skipped or failed"
        timeout-minutes: 10
