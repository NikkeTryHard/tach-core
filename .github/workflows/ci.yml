name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # Manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Faster compilation
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  # Detect what files changed to conditionally run jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'tests/**'
              - 'pyproject.toml'
              - '**/*.py'
            ci:
              - '.github/**'
              - 'deny.toml'
              - '.pre-commit-config.yaml'

  # Always runs - fast check
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    needs: changes
    # Run on code/ci changes, or if triggered manually
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Always runs - security is critical
  security:
    name: Security & License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # Only runs when code changes
  coverage:
    name: Code Coverage (llvm-cov)
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      COVERAGE_THRESHOLD: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install pytest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace \
            --lcov --output-path coverage/lcov.info \
            --html --output-dir coverage/html
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cargo llvm-cov --all-features --workspace --summary-only 2>/dev/null | grep -oP 'lines:\s+\K[\d.]+(?=%)' || echo "0")
          echo "Coverage: ${COVERAGE}%"
          echo "Threshold: ${COVERAGE_THRESHOLD}%"
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "::warning::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
          else
            echo "Coverage meets threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          name: tach-core-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Only runs when code changes
  gauntlet:
    name: Python Gauntlet Tests
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install pytest

      - name: Build Rust library
        run: cargo build --release

      - name: Run gauntlet tests
        run: |
          pytest tests/gauntlet/ -v --tb=short
          pytest tests/gauntlet_coverage/ -v --tb=short
          pytest tests/gauntlet_restoration/ -v --tb=short
          pytest tests/gauntlet_plugin/ -v --tb=short
          pytest tests/gauntlet_concurrent/ -v --tb=short
          pytest tests/gauntlet_011/ -v --tb=short
          pytest tests/gauntlet_012/ -v --tb=short
          pytest tests/gauntlet_013/ -v --tb=short
          pytest tests/gauntlet_014/ -v --tb=short
          pytest tests/gauntlet_db/ -v --tb=short || true
          pytest tests/gauntlet_numpy/ -v --tb=short || true
        timeout-minutes: 15

  # Only runs when code changes
  proptest:
    name: Property Tests
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Run property tests
        run: |
          cargo test --test proptest_coverage -- --test-threads=1
          cargo test --test proptest_snapshot -- --test-threads=1
          cargo test --test proptest_scheduler -- --test-threads=1
          cargo test --test proptest_discovery -- --test-threads=1
          cargo test --test proptest_namespace -- --test-threads=1
          cargo test --test proptest_reporter -- --test-threads=1
        timeout-minutes: 15
        env:
          PROPTEST_CASES: 256
