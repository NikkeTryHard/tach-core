# cargo-deny configuration (v2 format)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Ignore unmaintained/unsound advisories for transitive dependencies
# These are pulled in by rustpython-parser and other deps, not direct usage
ignore = [
    { id = "RUSTSEC-2021-0145", reason = "atty unsound on Windows only, we target Linux" },
    { id = "RUSTSEC-2024-0375", reason = "atty unmaintained, transitive dep from rustpython" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, transitive dep from rustpython" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "LGPL-3.0-only",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
