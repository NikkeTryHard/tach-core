# Speed-optimized Cargo config
# Uses mold linker + sccache for fast builds

[build]
# Use sccache for compilation caching
rustc-wrapper = "sccache"
# Parallel jobs (capped at 8 to limit SSD/CPU pressure)
jobs = 8

[target.x86_64-unknown-linux-gnu]
# Use mold linker (10x faster than default ld)
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[env]
# Parallel test threads (for cargo test, nextest uses its own config)
RUST_TEST_THREADS = "8"

[profile.dev]
incremental = true
codegen-units = 16

[profile.test]
incremental = true
codegen-units = 16
opt-level = 0
debug = 1
lto = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
