[package]
name = "tach-core-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
toml = "0.9"

[dependencies.tach-core]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_mapping_entry"
path = "fuzz_targets/fuzz_mapping_entry.rs"
test = false
doc = false
bench = false

