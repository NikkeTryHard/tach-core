# Codecov Configuration for tach-core
# https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 90%
        threshold: 2%
        if_ci_failed: error
        informational: false
    patch:
      default:
        target: 80%
        threshold: 5%
        if_ci_failed: error
        informational: false

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      macro: false
      method: false

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

flags:
  unit:
    paths:
      - src/
    carryforward: true
  integration:
    paths:
      - rust_tests/
    carryforward: true

ignore:
  - "fuzz/**"
  - "tests/**"
  - "benches/**"
  - "examples/**"
  - "target/**"
  - "**/*.md"
  - "**/build.rs"
