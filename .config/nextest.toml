# Nextest configuration for fast parallel testing

[profile.default]
# Run tests in parallel (capped at 8)
test-threads = 8
# Fail fast on first failure
fail-fast = true
# Retry flaky tests once
retries = 1
# Timeout per test
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
# CI-specific settings
test-threads = 4
fail-fast = false
retries = 0
